services:
  web:
    build: .
    container_name: hw2_dashboard
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./main:/app/main
      - ./dbms:/app/dbms
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/dbms